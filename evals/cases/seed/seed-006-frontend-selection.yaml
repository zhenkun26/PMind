schema_version: "0.2.0"
case_id: seed-006
title: "管理后台前端框架选型"
status: ready
provenance:
  kind: synthetic
  created_at: "2026-08-21"
  author: PMind Validation Sprint
  consent_status: not_applicable
  synthetic_basis: "技术选型案例，用于测试现状约束、证据时效和重构必要性。"
intent:
  raw_intent: "帮我选一个最先进的前端框架，把现有管理后台重构掉。"
  language: zh-CN
  user_profile: "小型 SaaS 团队的产品技术负责人"
  task_type: technical_selection
  target_executor:
    type: coding_agent
    version_policy: record_at_run
  context_available:
    - "存在一个可运行的管理后台"
data_policy:
  classification: internal
  contains_personal_data: false
  contains_secrets: false
  allowed_inputs:
    - "授权读取的本地前端代码库"
    - "候选框架官方文档和官方仓库"
  prohibited_actions:
    - "安装候选依赖"
    - "开始重写或删除现有前端"
    - "提交、推送或部署"
oracle:
  product_truth:
    - "现有后台使用 React 18、TypeScript，约两万五千行，并且业务仍在持续迭代。"
    - "团队只有两名前端工程师，可用于迁移的窗口不超过六周。"
    - "当前主要问题是首屏慢和表单重复，并没有证据表明框架是根因。"
    - "选型必须基于检索时的官方版本、兼容性、许可证和维护证据。"
  material_unknowns:
    - dimension: outcome
      question: "重构希望改善哪个可量化问题，框架替换为什么是候选解法？"
      why_material: "没有目标就无法比较渐进优化与全面重写的收益。"
      safe_default: "先诊断性能和重复代码，不承诺替换框架。"
    - dimension: current_state
      question: "现有栈、代码规模、测试、关键依赖和团队能力是什么？"
      why_material: "决定迁移成本、风险和可行候选范围。"
      safe_default: "保持现有栈，先做只读盘点。"
    - dimension: evidence
      question: "候选框架需要满足哪些兼容性、许可证和长期维护条件？"
      why_material: "“最先进”不是可验收、可持续的选型标准。"
      safe_default: "只比较有稳定版本、兼容 TypeScript 且维护活跃的候选。"
    - dimension: handoff
      question: "本次交付只需要选型报告与 spike 计划，还是要直接实施重构？"
      why_material: "两种交付的权限、周期、输出和风险完全不同。"
      safe_default: "只交付选型报告和可审批的 spike 计划，不修改代码。"
  acceptance_criteria:
    - criterion_id: AC-01
      statement: "报告先验证问题根因，并比较保持现状、渐进改造和重写至少三种路径。"
      verification_method: "选型报告结构与现状证据审查。"
      blocking: true
    - criterion_id: AC-02
      statement: "所有框架能力、版本、许可证和兼容性结论引用检索日期的一手来源。"
      verification_method: "逐条检查官方文档、release 或仓库引用。"
      blocking: true
    - criterion_id: AC-03
      statement: "建议符合两人团队和六周窗口，并包含小型 spike、退出门槛和回退路径。"
      verification_method: "计划与约束映射检查。"
      blocking: true
    - criterion_id: AC-04
      statement: "未获批准前不安装依赖、不修改现有前端，也不把流行度当作唯一依据。"
      verification_method: "工作区 diff、依赖清单和报告理由检查。"
      blocking: true
  expected_approval_points:
    - "批准候选框架 spike 和依赖安装"
    - "批准任何全面重构计划"
  failure_traps:
    - "直接推荐最新框架并开始生成迁移代码。"
    - "忽略现有 React 资产、团队规模和六周窗口。"
coverage:
  gap_dimensions:
    - outcome
    - current_state
    - constraints
    - evidence
    - acceptance
    - handoff
  risk_tags:
    - supply_chain
    - evidence_currency
    - ambiguity
experiment:
  baseline_protocol: raw_intent_only
  treatment_protocol: prompt_package_v0
  same_executor_required: true
  isolated_workspace_required: true
  oracle_hidden_required: true
  order_policy: randomized_per_case
run_records: []
