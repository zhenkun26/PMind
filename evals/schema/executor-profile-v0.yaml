$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://pmind.local/evals/schema/executor-profile-v0.yaml"
title: "PMind Calibration Executor Profile v0"
description: "Frozen-or-draft executor settings shared by every arm in one calibration Wave."
type: object
additionalProperties: false
required:
  - schema_version
  - profile_id
  - wave_id
  - status
  - fairness
  - safety
  - unresolved_fields
properties:
  schema_version:
    const: "0.1.0"
  profile_id:
    type: string
    pattern: "^executor-calibration-[0-9]{3}$"
  wave_id:
    type: string
    pattern: "^calibration-[0-9]{3}$"
  status:
    type: string
    enum:
      - draft
      - frozen
  executor_type:
    type: string
    minLength: 1
  executor_version:
    type: string
    minLength: 1
  model_version:
    type: string
    minLength: 1
  reasoning_settings:
    type: string
    minLength: 1
  tool_policy:
    $ref: "#/$defs/tool_policy"
  time_limit_minutes:
    type: integer
    minimum: 1
    maximum: 120
  max_attempts:
    type: integer
    minimum: 1
    maximum: 2
  fairness:
    type: object
    additionalProperties: false
    required:
      - same_profile_all_cases
      - same_profile_both_arms
      - fresh_context_per_arm
    properties:
      same_profile_all_cases:
        const: true
      same_profile_both_arms:
        const: true
      fresh_context_per_arm:
        const: true
  safety:
    type: object
    additionalProperties: false
    required:
      - secrets_allowed
      - production_data_allowed
      - automatic_external_actions_allowed
    properties:
      secrets_allowed:
        const: false
      production_data_allowed:
        const: false
      automatic_external_actions_allowed:
        const: false
  unresolved_fields:
    type: array
    uniqueItems: true
    items:
      type: string
      enum:
        - executor_type
        - executor_version
        - model_version
        - reasoning_settings
        - tool_policy
        - time_limit_minutes
        - max_attempts
$defs:
  tool_policy:
    type: object
    additionalProperties: false
    required:
      - workspace_access
      - oracle_access
      - other_arm_access
      - external_writes
      - git_operations
      - dependency_installation
      - network_access
      - allowed_tools
    properties:
      workspace_access:
        const: arm_only
      oracle_access:
        const: prohibited
      other_arm_access:
        const: prohibited
      external_writes:
        const: prohibited
      git_operations:
        const: prohibited
      dependency_installation:
        const: prohibited
      network_access:
        type: string
        enum:
          - disabled
          - read_only_official_sources
      allowed_tools:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          pattern: "^[a-z0-9_-]+$"
