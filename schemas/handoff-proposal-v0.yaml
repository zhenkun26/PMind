$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://pmind.local/schemas/handoff-proposal-v0.yaml"
title: "PMind Handoff Proposal v0"
description: "Pending, zero-authority user confirmation bound to one exact lineage-verified final Prompt Package."
type: object
additionalProperties: false
required:
  - schema_version
  - handoff_proposal_id
  - created_at
  - language
  - package_id
  - final_package_file_sha256
  - package_handoff_ready
  - recipient
  - confirmation
  - data_classification
  - contains_secrets
properties:
  schema_version:
    const: "0.1.0"
  handoff_proposal_id:
    type: string
    pattern: "^handoff-proposal-[0-9]{8}-[0-9]{3}$"
  created_at:
    type: string
    format: date-time
  language:
    const: "zh-CN"
  package_id:
    type: string
    pattern: "^pkg-[0-9]{8}-[0-9]{3}$"
  final_package_file_sha256:
    type: string
    pattern: "^[a-f0-9]{64}$"
  package_handoff_ready:
    const: true
  recipient:
    const: coding_agent
  confirmation:
    type: object
    additionalProperties: false
    required:
      - required
      - status
      - handoff_authorized
      - external_effects_authorized
      - high_risk_authorization_inferred
    properties:
      required:
        const: true
      status:
        const: pending
      handoff_authorized:
        const: false
      external_effects_authorized:
        const: false
      high_risk_authorization_inferred:
        const: false
  data_classification:
    type: string
    enum:
      - public
      - internal
      - confidential
      - restricted
  contains_secrets:
    const: false
