$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://pmind.local/schemas/clarification-session-v0.yaml"
title: "PMind Clarification Session v0"
description: "Immutable Intake, nine-dimension Gap Map, minimal Clarification rounds, and compile readiness."
type: object
additionalProperties: false
required:
  - schema_version
  - session_id
  - created_at
  - language
  - status
  - intake
  - round_policy
  - gaps
  - questions
  - rounds
  - assumptions
  - unknowns
  - decisions
  - compile_gate
properties:
  schema_version:
    const: "0.1.0"
  session_id:
    type: string
    pattern: "^session-[0-9]{8}-[0-9]{3}$"
  created_at:
    type: string
    format: date-time
  language:
    const: "zh-CN"
  status:
    type: string
    enum:
      - intake
      - gap_scan
      - clarifying
      - ready_to_compile
      - blocked
  intake:
    type: object
    additionalProperties: false
    required:
      - raw_intent
      - raw_intent_sha256
      - source_kind
      - user_profile
      - task_type
      - downstream_executor
      - data_classification
      - contains_personal_data
      - contains_secrets
      - allowed_context
    properties:
      raw_intent:
        type: string
        minLength: 10
      raw_intent_sha256:
        type: string
        pattern: "^[a-f0-9]{64}$"
      source_kind:
        type: string
        enum:
          - user
          - case
      user_profile:
        type: string
        minLength: 3
      task_type:
        $ref: "#/$defs/task_type"
      downstream_executor:
        const: coding_agent
      data_classification:
        $ref: "#/$defs/data_classification"
      contains_personal_data:
        type: boolean
      contains_secrets:
        const: false
      allowed_context:
        $ref: "#/$defs/strings"
  round_policy:
    type: object
    additionalProperties: false
    required:
      - default_max_rounds
      - extension_authorized_by_user
    properties:
      default_max_rounds:
        const: 3
      extension_authorized_by_user:
        type: boolean
      extension_reason:
        type: string
        minLength: 3
  gaps:
    type: array
    maxItems: 9
    items:
      type: object
      additionalProperties: false
      required:
        - dimension
        - status
        - blocking
        - summary
        - source_refs
      properties:
        dimension:
          $ref: "#/$defs/gap_dimension"
        status:
          type: string
          enum:
            - resolved
            - assumed
            - unknown
            - not_applicable
        blocking:
          type: boolean
        summary:
          type: string
          minLength: 3
        source_refs:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: "^(intake|QUESTION-[0-9]{3}|DECISION-[0-9]{3})$"
        knowledge_ref:
          type: string
          pattern: "^(ASSUMP|UNKNOWN)-[0-9]{3}$"
        not_applicable_reason:
          type: string
          minLength: 3
  questions:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - question_id
        - gap_dimension
        - question
        - why_now
        - affected_fields
        - safe_default_or_stop
        - priority
        - status
      properties:
        question_id:
          type: string
          pattern: "^QUESTION-[0-9]{3}$"
        gap_dimension:
          $ref: "#/$defs/gap_dimension"
        question:
          type: string
          minLength: 3
        why_now:
          type: string
          minLength: 3
        affected_fields:
          $ref: "#/$defs/non_empty_strings"
        safe_default_or_stop:
          type: string
          minLength: 3
        priority:
          type: object
          additionalProperties: false
          required:
            - materiality
            - uncertainty
            - answerability
            - friction
            - score
          properties:
            materiality:
              type: integer
              minimum: 0
              maximum: 3
            uncertainty:
              type: integer
              minimum: 0
              maximum: 3
            answerability:
              type: integer
              minimum: 0
              maximum: 2
            friction:
              type: integer
              minimum: 1
              maximum: 3
            score:
              type: integer
              minimum: -3
              maximum: 7
        status:
          type: string
          enum:
            - pending
            - asked
            - skipped
        round_number:
          type: integer
          minimum: 1
  rounds:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - round_number
        - completed_at
        - answers
      properties:
        round_number:
          type: integer
          minimum: 1
        completed_at:
          type: string
          format: date-time
        answers:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required:
              - question_id
              - user_answer
              - outcome_status
              - normalized_conclusion
              - affected_fields
            properties:
              question_id:
                type: string
                pattern: "^QUESTION-[0-9]{3}$"
              user_answer:
                type: string
                minLength: 1
              outcome_status:
                type: string
                enum:
                  - resolved
                  - assumed
                  - unknown
                  - refused
              normalized_conclusion:
                type: string
                minLength: 1
              affected_fields:
                $ref: "#/$defs/non_empty_strings"
  assumptions:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - assumption_id
        - statement
        - invalidation_impact
        - verification_method
      properties:
        assumption_id:
          type: string
          pattern: "^ASSUMP-[0-9]{3}$"
        statement:
          type: string
          minLength: 3
        invalidation_impact:
          type: string
          minLength: 3
        verification_method:
          type: string
          minLength: 3
  unknowns:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - unknown_id
        - question
        - blocking
      properties:
        unknown_id:
          type: string
          pattern: "^UNKNOWN-[0-9]{3}$"
        question:
          type: string
          minLength: 3
        blocking:
          type: boolean
  decisions:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - decision_id
        - selected_option
        - decision_maker_ref
        - rationale
        - alternatives
        - decided_at
      properties:
        decision_id:
          type: string
          pattern: "^DECISION-[0-9]{3}$"
        selected_option:
          type: string
          minLength: 1
        decision_maker_ref:
          $ref: "#/$defs/opaque_ref"
        rationale:
          type: string
          minLength: 3
        alternatives:
          $ref: "#/$defs/strings"
        decided_at:
          type: string
          format: date
  compile_gate:
    type: object
    additionalProperties: false
    required:
      - ready
      - blocking_reasons
      - material_conflicts
      - high_risk_actions
      - next_question_ids
      - stop_reason
    properties:
      ready:
        type: boolean
      blocking_reasons:
        $ref: "#/$defs/strings"
      material_conflicts:
        $ref: "#/$defs/strings"
      high_risk_actions:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
            - action
            - description
            - approval_point_required
          properties:
            action:
              type: string
              pattern: "^[a-z][a-z0-9_]{0,63}$"
            description:
              type: string
              minLength: 3
            approval_point_required:
              const: true
      next_question_ids:
        type: array
        maxItems: 3
        uniqueItems: true
        items:
          type: string
          pattern: "^QUESTION-[0-9]{3}$"
      stop_reason:
        type: string
        enum:
          - not_stopped
          - sufficient_information
          - user_requested_compile
          - max_rounds_reached
          - blocked
$defs:
  strings:
    type: array
    uniqueItems: true
    items:
      type: string
      minLength: 1
  non_empty_strings:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 1
  opaque_ref:
    type: string
    pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
  task_type:
    type: string
    enum:
      - product_exploration
      - feature_definition
      - competitor_research
      - technical_selection
      - coding_handoff
  data_classification:
    type: string
    enum:
      - public
      - internal
      - confidential
      - restricted
  gap_dimension:
    type: string
    enum:
      - outcome
      - user_scenario
      - scope
      - current_state
      - constraints
      - evidence
      - acceptance
      - risk_authority
      - handoff
