$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://pmind.local/schemas/handoff-adapter-effect-authorization-confirmation-receipt-v0.yaml"
title: "PMind Handoff Adapter Effect Authorization Confirmation Receipt v0"
description: "Immutable user choice over one exact Adapter Effect Authorization Proposal; named effect consent never authorizes dispatch or execution."
type: object
additionalProperties: false
required:
  - schema_version
  - adapter_effect_authorization_confirmation_id
  - captured_at
  - language
  - source_session_file_sha256
  - draft_package_file_sha256
  - compilation_proposal_file_sha256
  - compilation_confirmation_receipt_file_sha256
  - final_package_file_sha256
  - handoff_proposal_file_sha256
  - handoff_confirmation_receipt_file_sha256
  - handoff_envelope_file_sha256
  - adapter_profile_file_sha256
  - adapter_selection_proposal_file_sha256
  - adapter_selection_confirmation_receipt_file_sha256
  - payload_data_attestation_file_sha256
  - adapter_effect_authorization_proposal_file_sha256
  - package_id
  - envelope_id
  - adapter_profile_id
  - adapter_selection_proposal_id
  - adapter_selection_confirmation_id
  - payload_data_attestation_id
  - adapter_effect_authorization_proposal_id
  - envelope_delivery_state
  - adapter_profile_status
  - adapter_selection_proposal_status
  - selection_confirmation_decision
  - adapter_selected
  - payload_data_attestation_completed
  - overall_data_compatibility
  - adapter_effect_authorization_proposal_status
  - recipient
  - requested_effect_authorizations
  - confirmation_decision
  - effect_authorization_confirmed
  - effect_authorizations_granted
  - all_requested_effects_authorized
  - cost_effect_authorized
  - cost_limit_authorized
  - cost_disclosure_before_dispatch_required
  - production_data_access_authorized
  - retention_export_purpose_compatibility
  - adapter_implementation_attestation_required
  - provider_contract_test_required
  - dispatch_confirmation_required
  - effects_executable
  - dispatch_authorized
  - high_risk_authorization_inferred
  - user_response
  - user_response_sha256
  - data_classification
  - contains_personal_data
  - contains_secrets
properties:
  schema_version:
    const: "0.1.0"
  adapter_effect_authorization_confirmation_id:
    type: string
    pattern: "^adapter-effect-authorization-confirmation-[0-9]{8}-[0-9]{3}$"
  captured_at:
    type: string
    format: date-time
  language:
    const: zh-CN
  source_session_file_sha256:
    $ref: "#/$defs/sha256"
  draft_package_file_sha256:
    $ref: "#/$defs/sha256"
  compilation_proposal_file_sha256:
    $ref: "#/$defs/sha256"
  compilation_confirmation_receipt_file_sha256:
    $ref: "#/$defs/sha256"
  final_package_file_sha256:
    $ref: "#/$defs/sha256"
  handoff_proposal_file_sha256:
    $ref: "#/$defs/sha256"
  handoff_confirmation_receipt_file_sha256:
    $ref: "#/$defs/sha256"
  handoff_envelope_file_sha256:
    $ref: "#/$defs/sha256"
  adapter_profile_file_sha256:
    $ref: "#/$defs/sha256"
  adapter_selection_proposal_file_sha256:
    $ref: "#/$defs/sha256"
  adapter_selection_confirmation_receipt_file_sha256:
    $ref: "#/$defs/sha256"
  payload_data_attestation_file_sha256:
    $ref: "#/$defs/sha256"
  adapter_effect_authorization_proposal_file_sha256:
    $ref: "#/$defs/sha256"
  package_id:
    type: string
    pattern: "^pkg-[0-9]{8}-[0-9]{3}$"
  envelope_id:
    type: string
    pattern: "^handoff-envelope-[0-9]{8}-[0-9]{3}$"
  adapter_profile_id:
    type: string
    pattern: "^adapter-profile-[0-9]{8}-[0-9]{3}$"
  adapter_selection_proposal_id:
    type: string
    pattern: "^adapter-selection-proposal-[0-9]{8}-[0-9]{3}$"
  adapter_selection_confirmation_id:
    type: string
    pattern: "^adapter-selection-confirmation-[0-9]{8}-[0-9]{3}$"
  payload_data_attestation_id:
    type: string
    pattern: "^payload-data-attestation-[0-9]{8}-[0-9]{3}$"
  adapter_effect_authorization_proposal_id:
    type: string
    pattern: "^adapter-effect-authorization-proposal-[0-9]{8}-[0-9]{3}$"
  envelope_delivery_state:
    const: prepared
  adapter_profile_status:
    const: reviewed
  adapter_selection_proposal_status:
    const: pending
  selection_confirmation_decision:
    const: confirmed
  adapter_selected:
    const: true
  payload_data_attestation_completed:
    const: true
  overall_data_compatibility:
    const: compatible
  adapter_effect_authorization_proposal_status:
    const: pending
  recipient:
    const: coding_agent
  requested_effect_authorizations:
    type: array
    uniqueItems: true
    items:
      $ref: "#/$defs/effect_name"
  confirmation_decision:
    enum:
      - confirmed
      - modify_requested
      - rejected
  effect_authorization_confirmed:
    type: boolean
  effect_authorizations_granted:
    type: array
    uniqueItems: true
    items:
      $ref: "#/$defs/effect_name"
  all_requested_effects_authorized:
    type: boolean
  cost_effect_authorized:
    type: boolean
  cost_limit_authorized:
    const: false
  cost_disclosure_before_dispatch_required:
    type: boolean
  production_data_access_authorized:
    type: boolean
  retention_export_purpose_compatibility:
    const: not_attested
  adapter_implementation_attestation_required:
    const: true
  provider_contract_test_required:
    const: true
  dispatch_confirmation_required:
    const: true
  effects_executable:
    const: false
  dispatch_authorized:
    const: false
  high_risk_authorization_inferred:
    const: false
  user_response:
    type: string
    minLength: 1
    maxLength: 4000
  user_response_sha256:
    $ref: "#/$defs/sha256"
  data_classification:
    $ref: "#/$defs/data_classification"
  contains_personal_data:
    type: boolean
  contains_secrets:
    const: false
$defs:
  sha256:
    type: string
    pattern: "^[a-f0-9]{64}$"
  effect_name:
    type: string
    enum:
      - local_file_write
      - network_access
      - process_start
      - notification
      - external_service_write
      - cost_incurred
      - production_data_access
  data_classification:
    type: string
    enum:
      - public
      - internal
      - confidential
      - restricted
